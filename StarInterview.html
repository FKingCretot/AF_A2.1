<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Star Interview — Tampa Bay Times édition spéciale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1c2b45;
    --navy-soft:#2c3e5c;
    --navy-deep:#111c30;
    --gold:#c9a24a;
    --gold-light:#e7d7b5;
    --cream:#f7f3ea;
    --text:#2c2c2c;
    --muted:#6b6b6b;
    --line:#e6e2d8;
    --red:#a3273a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    color:var(--text);
    background:
      radial-gradient(circle at 15% 20%, rgba(201,162,74,0.18), transparent 40%),
      radial-gradient(circle at 85% 75%, rgba(201,162,74,0.14), transparent 45%),
      linear-gradient(160deg, var(--navy-deep), var(--navy) 55%, var(--navy-soft));
    background-attachment:fixed;
    min-height:100vh;
    padding-bottom:60px;
  }
  .stars{
    position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden;
  }
  .stars span{
    position:absolute; width:3px; height:3px; background:var(--gold-light);
    border-radius:50%; opacity:0.6; animation:twinkle 3.5s ease-in-out infinite;
  }
  @keyframes twinkle{ 0%,100%{opacity:0.15; transform:scale(1);} 50%{opacity:0.9; transform:scale(1.6);} }

  .kce-logo{
    position:fixed; top:16px; left:18px; z-index:40;
    height:34px; opacity:0.96;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,0.35));
  }

  header.masthead{
    position:relative; z-index:1;
    text-align:center; padding:70px 20px 22px;
  }
  header.masthead .kicker{
    letter-spacing:0.35em; text-transform:uppercase; font-size:12px;
    color:var(--gold-light); margin-bottom:10px; font-weight:600;
  }
  header.masthead h1{
    font-family:'Playfair Display',serif; font-weight:900; font-size:clamp(28px,5vw,46px);
    color:#fff; margin:0 0 8px; letter-spacing:0.01em;
  }
  header.masthead h1 span{color:var(--gold);}
  header.masthead p.sub{
    color:var(--gold-light); font-size:14px; margin:0; opacity:0.85;
  }
  header.masthead img.tbt-white{
    height:40px; margin:18px auto 0; display:block; opacity:0.95;
  }

  nav.tabs{
    position:relative; z-index:1;
    display:flex; gap:10px; justify-content:center; flex-wrap:wrap;
    padding:22px 16px 6px;
  }
  nav.tabs button{
    font-family:'Inter',sans-serif; font-weight:600; font-size:14px;
    padding:10px 20px; border-radius:999px; border:1px solid rgba(231,215,181,0.35);
    background:rgba(255,255,255,0.06); color:#f2ece0; cursor:pointer;
    transition:all .2s ease;
  }
  nav.tabs button:hover{ background:rgba(255,255,255,0.14); }
  nav.tabs button.active{
    background:var(--gold); color:var(--navy-deep); border-color:var(--gold);
    box-shadow:0 4px 14px rgba(201,162,74,0.35);
  }

  main{ position:relative; z-index:1; max-width:820px; margin:0 auto; padding:24px 18px 40px; }
  section.view{ display:none; animation:fadeIn .35s ease; }
  section.view.active{ display:block; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }

  /* ---- Générique ---- */
  .curtain-card{
    background:linear-gradient(180deg, #2a1620, #1c0f16);
    border:1px solid rgba(201,162,74,0.35);
    border-radius:18px; padding:44px 30px; text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,0.45);
    position:relative; overflow:hidden;
  }
  .curtain-card::before, .curtain-card::after{
    content:""; position:absolute; top:0; bottom:0; width:38%;
    background:repeating-linear-gradient(90deg, rgba(163,39,58,0.55) 0 14px, rgba(120,20,34,0.55) 14px 28px);
    opacity:0.55;
  }
  .curtain-card::before{ left:0; border-radius:18px 0 0 18px; }
  .curtain-card::after{ right:0; border-radius:0 18px 18px 0; }
  .curtain-card .inner{ position:relative; z-index:2; }
  .curtain-card h2{
    font-family:'Playfair Display',serif; color:var(--gold); font-size:clamp(22px,4vw,32px);
    margin:0 0 10px;
  }
  .curtain-card p{ color:#eee3d3; font-size:14.5px; line-height:1.6; max-width:480px; margin:0 auto 22px; }

  .jingle-btn{
    display:inline-flex; align-items:center; gap:10px;
    background:var(--gold); color:var(--navy-deep); border:none;
    font-family:'Inter',sans-serif; font-weight:700; font-size:15px;
    padding:14px 28px; border-radius:999px; cursor:pointer;
    box-shadow:0 8px 22px rgba(201,162,74,0.4);
    transition:transform .15s ease;
  }
  .jingle-btn:hover{ transform:translateY(-2px) scale(1.02); }
  .jingle-btn.playing{ background:var(--red); color:#fff; box-shadow:0 8px 22px rgba(163,39,58,0.45); }

  .star-grid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
    gap:14px; margin-top:30px;
  }
  .star-card{
    background:rgba(255,255,255,0.05); border:1px solid rgba(231,215,181,0.25);
    border-radius:14px; padding:20px 14px; cursor:pointer; text-align:center;
    transition:all .2s ease;
  }
  .star-card:hover{ background:rgba(255,255,255,0.11); transform:translateY(-3px); }
  .star-card .emoji{ font-size:34px; display:block; margin-bottom:8px; }
  .star-card .nm{ font-family:'Playfair Display',serif; color:#fff; font-size:16px; margin-bottom:2px; }
  .star-card .tt{ color:var(--gold-light); font-size:12px; }

  /* ---- Student page ---- */
  .front-page{
    background:var(--cream); border-radius:16px; overflow:hidden;
    box-shadow:0 20px 50px rgba(0,0,0,0.4);
  }
  .front-page .band{
    background:var(--navy-deep); padding:16px 22px; display:flex; align-items:center;
    justify-content:space-between; gap:14px; flex-wrap:wrap;
  }
  .front-page .band img{ height:26px; }
  .front-page .band .tag{
    color:var(--gold-light); font-size:11px; letter-spacing:0.2em; text-transform:uppercase;
    font-weight:600;
  }
  .front-page .hero{ padding:26px 26px 6px; text-align:center; border-bottom:3px double var(--navy); }
  .front-page .hero .emoji{ font-size:46px; }
  .front-page .hero h2{
    font-family:'Playfair Display',serif; font-weight:900; font-size:clamp(24px,4vw,34px);
    margin:6px 0 2px; color:var(--navy);
  }
  .front-page .hero .role{ font-style:italic; color:var(--muted); margin:0 0 16px; font-size:14.5px; }
  .front-page .intro{
    padding:20px 26px 6px; font-size:15px; line-height:1.7; color:var(--text);
  }
  .front-page .intro::first-letter{
    font-family:'Playfair Display',serif; font-size:46px; font-weight:900; color:var(--red);
    float:left; line-height:0.8; padding-right:8px; padding-top:6px;
  }
  .intro-en{
    margin-top:10px; padding-top:10px; border-top:1px dashed var(--line);
    font-size:12.5px; line-height:1.55; color:var(--muted); font-style:italic;
  }

  .deck{ padding:8px 22px 28px; }
  .deck-dots{ display:flex; gap:6px; justify-content:center; margin-bottom:14px; }
  .deck-dots span{ width:8px; height:8px; border-radius:50%; background:var(--line); transition:all .2s ease; display:inline-block; }
  .deck-dots span.active{ background:var(--accent, var(--gold)); width:22px; border-radius:4px; }

  .flip-scene{ perspective:1200px; margin-bottom:14px; }
  .flip-card{ position:relative; width:100%; min-height:220px; cursor:pointer; }
  .flip-card-inner{
    position:relative; width:100%; height:100%; min-height:220px;
    transition:transform .6s cubic-bezier(.4,.2,.2,1); transform-style:preserve-3d;
  }
  .flip-card.flipped .flip-card-inner{ transform:rotateY(180deg); }
  .flip-face{
    position:absolute; inset:0; backface-visibility:hidden; border-radius:12px;
    padding:20px 22px; display:flex; flex-direction:column; justify-content:center; overflow-y:auto;
  }
  .flip-front{
    background:linear-gradient(135deg, var(--accent, var(--gold)), var(--navy) 120%);
    color:#fff; text-align:center; align-items:center;
  }
  .flip-front .qnum-big{ font-family:'Playfair Display',serif; font-size:44px; font-weight:900; margin-bottom:6px; }
  .flip-front .hint{ font-size:12.5px; opacity:0.9; letter-spacing:0.03em; max-width:220px; }
  .flip-back{
    background:#fff; border:1px solid var(--line); border-left:5px solid var(--accent, var(--gold));
    transform:rotateY(180deg);
  }
  .flip-back .qtext{ font-size:16.5px; font-weight:600; color:var(--navy); line-height:1.4; margin-bottom:10px; }
  .qaids{ display:flex; gap:8px; flex-wrap:wrap; }
  .aid-btn{
    font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600;
    border:1px solid var(--line); background:var(--cream); color:var(--navy);
    padding:6px 12px; border-radius:999px; cursor:pointer; transition:all .15s ease;
  }
  .aid-btn:hover{ background:var(--gold-light); }
  .aid-panel{
    margin-top:10px; padding:10px 12px; border-radius:8px; font-size:13.5px; line-height:1.5;
    display:none;
  }
  .aid-panel.en{ background:#eef2f7; color:#33455f; }
  .aid-panel.starter{ background:var(--accentSoft, #f3ecd6); color:#4a3c1a; font-style:italic; }
  .aid-panel.show{ display:block; }
  .piste-en{
    margin-top:6px; padding-top:6px; border-top:1px dashed rgba(0,0,0,0.12);
    font-size:12px; font-style:normal; opacity:0.8;
  }

  .deck-nav{ display:flex; align-items:center; justify-content:center; gap:16px; }
  .nav-btn{
    background:var(--navy); color:#fff; border:none; width:36px; height:36px; border-radius:50%;
    cursor:pointer; font-size:16px; display:flex; align-items:center; justify-content:center;
    transition:all .15s ease;
  }
  .nav-btn:hover{ background:var(--accent, var(--gold)); }
  .nav-btn:disabled{ opacity:0.3; cursor:default; }
  .deck-count{ font-size:13px; color:var(--muted); font-weight:600; min-width:50px; text-align:center; }

  .bonus-fab{
    position:fixed; right:20px; bottom:20px; z-index:30;
    background:var(--navy); color:var(--gold-light); border:1px solid var(--gold);
    border-radius:999px; padding:12px 18px; font-weight:700; font-size:13px;
    cursor:pointer; box-shadow:0 8px 20px rgba(0,0,0,0.4);
    display:flex; align-items:center; gap:6px; opacity:0.85; transition:all .2s ease;
  }
  .bonus-fab:hover{ opacity:1; transform:translateY(-2px); }
  .bonus-panel{
    display:none; margin:0 22px 26px; padding:16px 18px; border-radius:12px;
    background:var(--navy-soft); border:1px dashed var(--gold);
  }
  .bonus-panel.show{ display:block; }
  .bonus-panel .lbl{ color:var(--gold-light); font-size:12px; letter-spacing:0.12em; text-transform:uppercase; font-weight:700; margin-bottom:10px; }
  .bonus-panel .flip-back{ background:rgba(255,255,255,0.96); }

  footer.foot{
    text-align:center; color:var(--gold-light); opacity:0.55; font-size:12px; padding:30px 10px 10px;
  }

  @media (max-width:520px){
    header.masthead{ padding-top:60px; }
    .front-page .intro, .qwrap{ padding-left:18px; padding-right:18px; }
  }
</style>
</head>

<script>
const PERSONAS = [{"id": "britt", "name": "Britt Fontaine", "title": "Reine des Flamants Roses de Sarasota", "emoji": "🦩", "accent": "#e0748a", "accentSoft": "#f9e2e7", "intro": "Depuis douze ans, elle organise la fameuse parade des flamants roses sur la plage de Siesta Key. Chaque samedi matin, elle promène ses flamants (en plastique... ou pas ?) devant des centaines de touristes. Aujourd'hui, le Tampa Bay Times rencontre la reine incontestée de Sarasota : Britt Fontaine !", "introEn": "For twelve years, she has organized the famous pink flamingo parade on Siesta Key beach. Every Saturday morning, she walks her flamingos (plastic ones... or are they?) in front of hundreds of tourists. Today, the Tampa Bay Times meets Sarasota's undisputed queen: Britt Fontaine!", "primary": [{"fr": "Depuis quand aimez-vous les flamants roses ?", "en": "How long have you liked pink flamingos?", "starter": "Le rose est ma couleur préférée ! / J'aime voir la vie en rose.", "starterEn": "Pink is my favorite color! / I love seeing life through rose-colored glasses."}, {"fr": "Pendant combien de temps préparez-vous une parade ?", "en": "How long does it take you to prepare a parade?", "starter": "Je ne compte pas mes heures, je compte mes flamants ! / Toute la semaine, entre deux cafés.", "starterEn": "I don't count my hours, I count my flamingos! / All week, between cups of coffee."}, {"fr": "Qu'est-ce que vous avez fait pour la parade la semaine dernière ?", "en": "What did you do for the parade last week?", "starter": "J'ai acheté 200 flamants en plastique ! / J'ai répété ma chorégraphie avec les flamants.", "starterEn": "I bought 200 plastic flamingos! / I rehearsed my choreography with the flamingos."}, {"fr": "Quel est votre meilleur souvenir de parade ?", "en": "What's your best parade memory?", "starter": "Le jour où le maire a dansé avec un flamant ! / Le jour où il a plu des confettis roses.", "starterEn": "The day the mayor danced with a flamingo! / The day it rained pink confetti."}], "bonus": [{"fr": "Comment avez-vous eu cette idée, un jour ?", "en": "How did you get this idea, one day?", "starter": "J'ai rêvé d'un flamant qui parlait ! / C'était un soir d'été, après un mojito de trop.", "starterEn": "I dreamed of a talking flamingo! / It was a summer night, after one too many mojitos."}, {"fr": "Est-ce qu'un flamant s'est déjà échappé ? Qu'est-ce qui s'est passé ?", "en": "Has a flamingo ever escaped? What happened?", "starter": "Oui, il a fini dans la piscine du voisin ! / Il a disparu trois jours, on l'a retrouvé au country club.", "starterEn": "Yes, it ended up in the neighbor's pool! / It disappeared for three days, we found it at the country club."}]}, {"id": "mary-ellen", "name": "Mary-Ellen Beauchamp", "title": "La Comtesse du Country Club", "emoji": "💎", "accent": "#8a6f2f", "accentSoft": "#f3ecd6", "intro": "Elle porte toujours des lunettes de soleil, même en réunion de copropriété. On raconte qu'elle a vécu à Paris... ou peut-être pas. Voici la mystérieuse Comtesse du Country Club de Sarasota, Mary-Ellen Beauchamp !", "introEn": "She always wears sunglasses, even at homeowners' association meetings. Rumor has it she once lived in Paris... or maybe not. Here is the mysterious Countess of the Sarasota Country Club, Mary-Ellen Beauchamp!", "primary": [{"fr": "Depuis combien de temps êtes-vous membre du country club ?", "en": "How long have you been a member of the country club?", "starter": "Depuis toujours, c'est dans mon sang ! / Depuis que j'ai gagné le tournoi de bridge en 1998.", "starterEn": "Forever, it's in my blood! / Since I won the bridge tournament in 1998."}, {"fr": "Pendant combien de temps avez-vous pris des leçons de tango ?", "en": "How long did you take tango lessons for?", "starter": "Assez longtemps pour briser trois cœurs ! / Le temps de trouver mon partenaire idéal, Sergio.", "starterEn": "Long enough to break three hearts! / Long enough to find my perfect partner, Sergio."}, {"fr": "Qu'est-ce que vous avez porté au dernier grand gala ?", "en": "What did you wear to the last big gala?", "starter": "Une robe couleur champagne et trop de diamants ! / Un turban doré, comme une vraie comtesse.", "starterEn": "A champagne-colored dress and too many diamonds! / A golden turban, like a true countess."}, {"fr": "Quel est le secret de votre élégance légendaire ?", "en": "What's the secret to your legendary elegance?", "starter": "Ne jamais sourire avant midi ! / Du rouge à lèvres et beaucoup de mystère.", "starterEn": "Never smile before noon! / Red lipstick and a lot of mystery."}], "bonus": [{"fr": "On dit que vous avez vécu à Paris, c'est vrai ?", "en": "They say you lived in Paris, is that true?", "starter": "Bien sûr... ou j'ai juste vu la Tour Eiffel sur une carte postale ! / Oui, dans mes rêves les plus fous.", "starterEn": "Of course... or I just saw the Eiffel Tower on a postcard! / Yes, in my wildest dreams."}, {"fr": "Est-ce que vous vous êtes déjà disputée avec la présidente du club ? Racontez !", "en": "Have you ever argued with the club president? Tell us!", "starter": "C'était à cause d'un gâteau mal coupé ! / Une histoire de chaise longue au bord de la piscine.", "starterEn": "It was over a badly cut cake! / A story about a lounge chair by the pool."}]}, {"id": "patricia", "name": "Capitaine Patricia Laroche", "title": "Du bateau « Le Lamantin Joyeux »", "emoji": "🏴‍☠️", "accent": "#1f7a6c", "accentSoft": "#dcefec", "intro": "Chaque soir, au coucher du soleil, elle prend la barre de son bateau pirate à Sarasota. Les touristes adorent ses histoires... et ses blagues. Voici la capitaine la plus célèbre de la baie : Patricia Laroche !", "introEn": "Every evening, at sunset, she takes the helm of her pirate boat in Sarasota. Tourists love her stories... and her jokes. Here is the most famous captain of the bay: Patricia Laroche!", "primary": [{"fr": "Depuis quand êtes-vous capitaine de bateau ?", "en": "How long have you been a boat captain?", "starter": "Depuis que j'ai volé mon premier bateau, à huit ans ! / Depuis le jour où j'ai trouvé ce chapeau de pirate.", "starterEn": "Ever since I stole my first boat, at age eight! / Since the day I found this pirate hat."}, {"fr": "Pendant combien de temps avez-vous navigué la semaine dernière ?", "en": "How long did you sail for last week?", "starter": "Toute la semaine, sauf le mardi, jour de lessive ! / Trois jours, à cause d'une tempête imaginaire.", "starterEn": "All week, except Tuesday, laundry day! / Three days, because of an imaginary storm."}, {"fr": "Quel trésor avez-vous trouvé récemment (ou inventé) ?", "en": "What treasure have you found recently (or made up)?", "starter": "Une pièce d'or... qui était en chocolat ! / Un vieux coffre plein de coquillages.", "starterEn": "A gold coin... that turned out to be chocolate! / An old chest full of seashells."}, {"fr": "Est-ce que vous vous êtes déjà perdue en mer, une fois ?", "en": "Have you ever gotten lost at sea, one time?", "starter": "Oui, à cause d'un GPS qui n'aimait pas les pirates ! / Non, jamais, mon perroquet connaît le chemin.", "starterEn": "Yes, because of a GPS that didn't like pirates! / No, never, my parrot knows the way."}], "bonus": [{"fr": "Comment êtes-vous devenue pirate, un jour ?", "en": "How did you become a pirate, one day?", "starter": "Un vieux film m'a inspirée ! / J'ai trouvé le chapeau dans un vide-grenier.", "starterEn": "An old movie inspired me! / I found the hat at a garage sale."}, {"fr": "Qu'est-ce qui s'est passé pendant votre pire tempête ?", "en": "What happened during your worst storm?", "starter": "Le bateau a tourné trois fois sur lui-même ! / On a perdu le perroquet pendant cinq minutes.", "starterEn": "The boat spun around three times! / We lost the parrot for five minutes."}]}];

(function(){
  const box = document.getElementById('stars');
  for(let i=0;i<40;i++){
    const s = document.createElement('span');
    s.style.left = Math.random()*100+'%';

    s.style.animationDelay = (Math.random()*3.5)+'s';
    box.appendChild(s);
  }
})();

// ---- audio jingle (synthesized, no external file needed) ----
let audioCtx = null;
let activeNodes = [];
let jinglePlaying = false;

function getCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function stopJingle(){
  activeNodes.forEach(n=>{ try{ n.stop(); }catch(e){} });
  activeNodes = [];
  jinglePlaying = false;
  const btn = document.getElementById('jingleBtn');
  if(btn){ btn.textContent = '▶ Jouer le générique'; btn.classList.remove('playing'); }
}
function playJingle(){
  const ctx = getCtx();
  if(ctx.state === 'suspended') ctx.resume();
  stopJingle();
  const now = ctx.currentTime;

  // Phase 1 — rising drumroll (filtered noise sweep)
  const dur = 0.9;
  const bufferSize = Math.floor(ctx.sampleRate*dur);
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++){ data[i] = (Math.random()*2-1); }
  const noise = ctx.createBufferSource();
  noise.buffer = buffer;
  const noiseFilter = ctx.createBiquadFilter();
  noiseFilter.type = 'bandpass';
  noiseFilter.frequency.setValueAtTime(400, now);
  noiseFilter.frequency.exponentialRampToValueAtTime(2200, now+dur);
  const noiseGain = ctx.createGain();
  noiseGain.gain.setValueAtTime(0.0001, now);
  noiseGain.gain.exponentialRampToValueAtTime(0.4, now+dur*0.9);
  noiseGain.gain.exponentialRampToValueAtTime(0.0001, now+dur);
  noise.connect(noiseFilter).connect(noiseGain).connect(ctx.destination);
  noise.start(now); noise.stop(now+dur+0.02);
  activeNodes.push(noise);

  // Phase 2 — opening stab chord
  const stabT = now + dur;
  [523.25, 659.25, 783.99].forEach(freq=>{
    const osc = ctx.createOscillator();
    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(freq, stabT);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, stabT);
    g.gain.exponentialRampToValueAtTime(0.18, stabT+0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, stabT+0.45);
    osc.connect(g).connect(ctx.destination);
    osc.start(stabT); osc.stop(stabT+0.5);
    activeNodes.push(osc);
  });

  // Phase 3 — ascending arpeggio (5 notes)
  const arpStart = stabT + 0.5;
  const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
  notes.forEach((freq, i)=>{
    const t = arpStart + i*0.16;
    const osc = ctx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(freq, t);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.22, t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.3);
    osc.connect(g).connect(ctx.destination);
    osc.start(t); osc.stop(t+0.32);
    activeNodes.push(osc);
  });

  // Phase 4 — rhythmic mini-theme ("vamp"), fills out the generique to a real length
  const themeStart = arpStart + notes.length*0.16 + 0.1;
  const beatDur = 0.55;
  const progression = [
    [261.63, 329.63, 392.00],   // C
    [196.00, 246.94, 293.66],   // G
    [261.63, 329.63, 392.00],   // C
    [220.00, 277.18, 329.63],   // Am
    [174.61, 220.00, 261.63],   // F
    [196.00, 246.94, 293.66]    // G
  ];
  progression.forEach((chord, i)=>{
    const t = themeStart + i*beatDur;
    chord.forEach(freq=>{
      const osc = ctx.createOscillator();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, t);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.13, t+0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t+beatDur*0.9);
      osc.connect(g).connect(ctx.destination);
      osc.start(t); osc.stop(t+beatDur);
      activeNodes.push(osc);
    });
    const bass = ctx.createOscillator();
    bass.type = 'sine';
    bass.frequency.setValueAtTime(chord[0]/2, t);
    const bg = ctx.createGain();
    bg.gain.setValueAtTime(0.0001, t);
    bg.gain.exponentialRampToValueAtTime(0.28, t+0.03);
    bg.gain.exponentialRampToValueAtTime(0.0001, t+beatDur*0.95);
    bass.connect(bg).connect(ctx.destination);
    bass.start(t); bass.stop(t+beatDur);
    activeNodes.push(bass);
  });

  // Phase 5 — final sustained chord, slow decay ("ta-daa")
  const finalT = themeStart + progression.length*beatDur + 0.05;
  [523.25, 659.25, 783.99, 1046.50].forEach(freq=>{
    const osc = ctx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, finalT);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, finalT);
    g.gain.exponentialRampToValueAtTime(0.24, finalT+0.05);
    g.gain.exponentialRampToValueAtTime(0.0001, finalT+1.8);
    osc.connect(g).connect(ctx.destination);
    osc.start(finalT); osc.stop(finalT+1.85);
    activeNodes.push(osc);
  });

  jinglePlaying = true;
  const btn = document.getElementById('jingleBtn');
  btn.textContent = '⏸ Stop';
  btn.classList.add('playing');
  const totalMs = ((finalT - now) + 1.9) * 1000;
  setTimeout(()=>{ if(jinglePlaying) stopJingle(); }, totalMs);
}

// ---- views ----
function renderGenerique(){
  const stars = PERSONAS.map(p => `
    <div class="star-card" data-jump="${p.id}">
      <span class="emoji">${p.emoji}</span>
      <div class="nm">${p.name}</div>
      <div class="tt">${p.title}</div>
    </div>`).join('');
  return `
  <div class="curtain-card">
    <div class="inner">
      <h2>🎙️ Édition spéciale — Star Interview</h2>
      <p>Le Tampa Bay Times a rencontré trois célébrités de Sarasota. Prêts à démarrer l'interview ? Lancez le générique, puis choisissez votre star !</p>
      <button class="jingle-btn" id="jingleBtn" onclick="playJingle()">▶ Jouer le générique</button>
      <div class="star-grid">${stars}</div>
    </div>
  </div>`;
}

// ---- flip-card deck state (one question shown at a time, per persona/set) ----
const deckState = {};
PERSONAS.forEach(p=>{ deckState[p.id] = { pIdx:0, pFlipped:false, bIdx:0, bFlipped:false, bonusOpen:false }; });
let currentView = 'generique';

function flipDeckHTML(p, setName){
  const list = setName==='primary' ? p.primary : p.bonus;
  const st = deckState[p.id];
  const idx = setName==='primary' ? st.pIdx : st.bIdx;
  const flipped = setName==='primary' ? st.pFlipped : st.bFlipped;
  const q = list[idx];
  const uid = setName+'-'+p.id+'-'+idx;
  const label = setName==='primary' ? ('Question '+(idx+1)) : 'Question bonus';
  const dots = list.map((_,i)=>`<span class="${i===idx?'active':''}"></span>`).join('');
  return `
  <div class="deck-dots">${dots}</div>
  <div class="flip-scene">
    <div class="flip-card ${flipped?'flipped':''}" onclick="flipCard('${p.id}','${setName}')">
      <div class="flip-card-inner">
        <div class="flip-face flip-front">
          <div class="qnum-big">${idx+1}</div>
          <div class="hint">${label} — cliquez pour retourner la carte 🔄</div>
        </div>
        <div class="flip-face flip-back">
          <div class="qtext">${q.fr}</div>
          <div class="qaids">
            <button class="aid-btn" onclick="event.stopPropagation(); toggleAid('en-${uid}')">🇬🇧 Traduction</button>
            <button class="aid-btn" onclick="event.stopPropagation(); toggleAid('st-${uid}')">💡 Piste de réponse</button>
          </div>
          <div class="aid-panel en" id="en-${uid}">${q.en}</div>
          <div class="aid-panel starter" id="st-${uid}">${q.starter}<div class="piste-en">${q.starterEn}</div></div>
        </div>
      </div>
    </div>
  </div>
  <div class="deck-nav">
    <button class="nav-btn" onclick="navDeck(event,'${p.id}','${setName}',-1)" ${idx===0?'disabled':''}>◀</button>
    <span class="deck-count">${idx+1} / ${list.length}</span>
    <button class="nav-btn" onclick="navDeck(event,'${p.id}','${setName}',1)" ${idx===list.length-1?'disabled':''}>▶</button>
  </div>`;
}

function flipCard(pid, setName){
  const st = deckState[pid];
  if(setName==='primary') st.pFlipped = !st.pFlipped; else st.bFlipped = !st.bFlipped;
  rerender();
}
function navDeck(event, pid, setName, dir){
  event.stopPropagation();
  const st = deckState[pid];
  const p = PERSONAS.find(x=>x.id===pid);
  const list = setName==='primary' ? p.primary : p.bonus;
  if(setName==='primary'){
    st.pIdx = Math.min(list.length-1, Math.max(0, st.pIdx+dir));
    st.pFlipped = false;
  } else {
    st.bIdx = Math.min(list.length-1, Math.max(0, st.bIdx+dir));
    st.bFlipped = false;
  }
  rerender();
}
function toggleAid(id){
  const el = document.getElementById(id);
  if(el) el.classList.toggle('show');
}
function toggleBonus(pid){
  deckState[pid].bonusOpen = !deckState[pid].bonusOpen;
  rerender();
}

function renderStudent(p){
  const st = deckState[p.id];
  return `
  <div class="front-page" style="--accent:${p.accent}; --accentSoft:${p.accentSoft};">
    <div class="band">
      <img src="${TBT_WHITE}" alt="Tampa Bay Times" style="height:24px;">
      <div class="tag">Interview exclusive</div>
    </div>
    <div class="hero">
      <div class="emoji">${p.emoji}</div>
      <h2>${p.name}</h2>
      <p class="role">${p.title}</p>
      <img src="${TBT_BLACK}" alt="Tampa Bay Times" style="height:18px; opacity:0.65; margin-top:4px;">
    </div>
    <div class="intro">${p.intro}<div class="intro-en">${p.introEn}</div></div>
    <div class="deck">${flipDeckHTML(p,'primary')}</div>
  </div>
  <button class="bonus-fab" onclick="toggleBonus('${p.id}')">${st.bonusOpen ? '✖ Fermer les bonus' : '🔒 + Bonus'}</button>
  <div class="bonus-panel ${st.bonusOpen?'show':''}">
    <div class="lbl">Questions bonus (si le temps le permet)</div>
    ${flipDeckHTML(p,'bonus')}
  </div>`;
}

function buildMain(){
  const main = document.getElementById('main');
  let html = `<section class="view active" data-view="generique">${renderGenerique()}</section>`;
  PERSONAS.forEach(p=>{
    html += `<section class="view" data-view="${p.id}">${renderStudent(p)}</section>`;
  });
  main.innerHTML = html;
}

function rerender(){
  buildMain();
  showView(currentView);
}

function showView(view){
  currentView = view;
  document.querySelectorAll('section.view').forEach(s=>{
    s.classList.toggle('active', s.dataset.view === view);
  });
  document.querySelectorAll('nav.tabs button').forEach(b=>{
    b.classList.toggle('active', b.dataset.view === view);
  });
}

document.getElementById('tabs').addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-view]');
  if(!btn) return;
  showView(btn.dataset.view);
});

document.addEventListener('click', (e)=>{
  const card = e.target.closest('.star-card[data-jump]');
  if(card){ showView(card.dataset.jump); }
});

buildMain();
</script>
</body>
</html>
